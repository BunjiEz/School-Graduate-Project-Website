<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CWK DEK69</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@200;300;400;600;700;800&display=swap" rel="stylesheet">

  <!-- Stylesheet -->
  <link rel="stylesheet" href="CSS/style.css">
</head>
<body>

  <!-- ════════════════════════════════
       WELCOME POPUP
  ════════════════════════════════ -->
  <div class="welcome-overlay" id="welcomeOverlay">
    <div class="welcome-card" id="welcomeCard">
      <div class="welcome-emoji">🎓</div>
      <h1 class="welcome-title">ยินดีด้วยนะ<br>จบแล้วววววว</h1>
      <p class="welcome-sub">กดตกลงเพื่อไปต่อ</p>
      <button class="welcome-btn" id="welcomeBtn">ตกลง</button>
    </div>
  </div>

  <!-- Background layer -->
  <div class="bg-fixed"></div>

  <!-- Canvas: floating client photos (z-index 0) -->
  <canvas id="photo-canvas"></canvas>

  <!-- Canvas: confetti (z-index 1) -->
  <canvas id="confetti-canvas"></canvas>

  <!-- BG Music
       ↓↓↓ Replace the src with your music file path or URL ↓↓↓
       Example: <source src="music/song.mp3" type="audio/mpeg">
  -->
  <audio id="bgMusic" loop preload="auto">
    <source src="/bgaudio/bgaudio.wav" type="audio/mpeg">
  </audio>

  <!-- ════════════════════════════════
       BOTTOM NAVBAR — iOS 26 Liquid Glass
  ════════════════════════════════ -->
  <nav class="navbar">

    <!-- Social icons group -->
    <div class="nav-group">

      <!-- Facebook ↓↓↓ Replace href with your Facebook URL -->
      <a href="https://facebook.com/sukholpat.paowan/" target="_blank" rel="noopener" class="nav-icon fb">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/>
        </svg>
        <span>Facebook</span>
      </a>

      <!-- Instagram ↓↓↓ Replace href with your Instagram URL -->
      <a href="https://instagram.com/sukholpat._/" target="_blank" rel="noopener" class="nav-icon ig">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="2" width="20" height="20" rx="5" ry="5"/>
          <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/>
          <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/>
        </svg>
        <span>Instagram</span>
      </a>

      <!-- TikTok ↓↓↓ Replace href with your TikTok URL -->
      <a href="https://tiktok.com/@sukholpat._/" target="_blank" rel="noopener" class="nav-icon tt">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-2.88 2.5
                   2.89 2.89 0 0 1-2.89-2.89 2.89 2.89 0 0 1 2.89-2.89c.28 0 .54.04.79.1V9.01
                   a6.34 6.34 0 0 0-.79-.05 6.34 6.34 0 0 0-6.34 6.34 6.34 6.34 0 0 0 6.34 6.34
                   6.34 6.34 0 0 0 6.33-6.34V8.69a8.18 8.18 0 0 0 4.78 1.52V6.76a4.85 4.85 0 0 1-1.01-.07z"/>
        </svg>
        <span>TikTok</span>
      </a>

    </div>

    <!-- Separator -->
    <div class="nav-sep"></div>

    <!-- Music toggle -->
    <button class="music-btn playing" id="musicBtn" aria-label="Toggle music">
      <!-- Muted: circle with X -->
      <svg id="iconMuted" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" style="display:none">
        <circle cx="12" cy="12" r="9"/>
        <line x1="9" y1="9" x2="15" y2="15"/>
        <line x1="15" y1="9" x2="9" y2="15"/>
      </svg>
      <!-- Playing: circle with equalizer bars -->
      <svg id="iconPlaying" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="9"/>
        <path d="M10 8v8M14 8v8M8 10.5v3M16 10.5v3"/>
      </svg>
    </button>

  </nav>

  <!-- ════════════════════════════════
       HERO SECTION
  ════════════════════════════════ -->
  <section class="page hero">
    <div class="glass-orb"></div>
    <div class="hero-texts">
      <!-- Text 1: per-character bounce animation -->
      <div class="t1-wrap" id="t1"></div>
      <div class="liquid-divider"></div>
      <!-- Text 2: per-character ramp animation -->
      <div class="t2-wrap" id="t2"></div>
    </div>
    <div class="scroll-hint">
      <div class="arr"></div>
      <span>เลื่อนลง</span>
    </div>
  </section>

  <!-- ════════════════════════════════
       CAMERA SECTION
  ════════════════════════════════ -->
  <section class="page camera-section">
    <!-- Text 3: ramp animation on scroll -->
    <div class="t3-wrap" id="t3"></div>

    <div class="cam-glass-wrap">
      <div class="ring"></div>
      <div class="ring"></div>
      <label for="file-input" class="camera-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
          <circle cx="12" cy="13" r="4"/>
        </svg>
      </label>
      <!-- accept="image/*" opens camera on mobile, gallery on desktop -->
      <input type="file" id="file-input" accept="image/*" capture="environment">
    </div>
  </section>

  <!-- ════════════════════════════════
       QR PAYMENT SECTION
  ════════════════════════════════ -->
  <section class="page qr-section">
    <div class="qr-card" id="qrCard">
      <div class="qr-label-wrap" id="qrLabel">
        <div class="qr-label-row">
          <span class="qr-label-ch">เ</span><span class="qr-label-ch">ลี้</span><span class="qr-label-ch">ย</span><span class="qr-label-ch">ง</span><span class="qr-label-ch">ก</span><span class="qr-label-ch">า</span><span class="qr-label-ch">แ</span><span class="qr-label-ch">ฟ</span><span class="qr-label-ch">ผ</span><span class="qr-label-ch">ม</span><span class="qr-label-ch">ที</span><span class="qr-label-ch">ค</span><span class="qr-label-ch">รั</span><span class="qr-label-ch">บ</span><span class="qr-label-ch">&nbsp;</span><span class="qr-label-ch">☕</span>
        </div>
        <div class="qr-label-row qr-label-sub">
          <span class="qr-label-ch">ตั้</span><span class="qr-label-ch">ง</span><span class="qr-label-ch">ใ</span><span class="qr-label-ch">จ</span><span class="qr-label-ch">ท</span><span class="qr-label-ch">ำ</span><span class="qr-label-ch">ให้</span><span class="qr-label-ch">ทุ</span><span class="qr-label-ch">ก</span><span class="qr-label-ch">ๆ</span><span class="qr-label-ch">ค</span><span class="qr-label-ch">น</span><span class="qr-label-ch">เ</span><span class="qr-label-ch">ล</span><span class="qr-label-ch">ย</span><span class="qr-label-ch">น</span><span class="qr-label-ch">ะ</span><span class="qr-label-ch">&nbsp;</span><span class="qr-label-ch">^^</span>
        </div>
      </div>
      <img src="images/promptpay.jpg" alt="PromptPay QR" class="qr-img" id="qrImg">
    </div>
  </section>

  <!-- ════════════════════════════════
       IMAGE VIEWER OVERLAY
  ════════════════════════════════ -->
  <div class="image-overlay" id="imageOverlay">
    <div class="blur-bg"></div>
    <div class="image-wrapper" id="imageWrapper">
      <!-- Swipe THIS image upward to close -->
      <img class="preview-img" id="previewImg" src="" alt="preview">
      <input class="caption-input" id="captionInput" type="text" placeholder="เขียนอะไรสักอย่าง...">
      <div class="swipe-guide">
        <div class="swipe-guide-pill"></div>
        <span>Swipe image up to close</span>
      </div>
    </div>
  </div>

  <!-- Main JS -->
  <script src="JS/main.js"></script>

</body>
</html>
